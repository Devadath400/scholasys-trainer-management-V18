function saveLocal(){
  // Browser storage is only a cache; Google Apps Script/Sheets remains authoritative.
  // A localStorage quota error must not turn a successful server-side inspection into a failed action.
  const storageKey='stsTrainerDB';
  const compactForStorage=(value)=>{
    if(Array.isArray(value)) return value.map(v=>compactForStorage(v));
    if(value&&typeof value==='object'){
      const out={};
      Object.keys(value).forEach(k=>{out[k]=compactForStorage(value[k]);});
      return out;
    }
    if(typeof value==='string' && value.length>1000 && /^data:(image|application|audio|video)\//i.test(value)) return '';
    if(typeof value==='string' && value.length>500000 && /^(?:[A-Za-z0-9+/=\r\n]+)$/.test(value)) return '';
    return value;
  };
  try{
    localStorage.setItem(storageKey,JSON.stringify(db));
    return true;
  }catch(firstError){
    try{
      localStorage.setItem(storageKey,JSON.stringify(compactForStorage(db)));
      console.warn('Local cache compacted to fit browser storage. Server data is unchanged.');
      return true;
    }catch(secondError){
      try{
        // Clear only this app's oversized local cache and keep a small metadata-only cache.
        localStorage.removeItem(storageKey);
        const minimal={
          employeeAccounts:db.employeeAccounts||{}, locations:db.locations||[],

        };
        localStorage.setItem(storageKey,JSON.stringify(minimal));
        console.warn('Local cache reduced to metadata because browser storage is full. Server data is unchanged.');
        return true;
      }catch(finalError){
        console.warn('Browser storage is full; local cache could not be written. Server operations can continue.',finalError);
        return false;
      }
    }
  }

function calendar(){
  const now=new Date();
  const year=now.getFullYear(), month=now.getMonth();
  const first=new Date(year,month,1), last=new Date(year,month+1,0);
  const start=first.getDay(), days=last.getDate();
  const my=(db.attendance||[]).filter(a=>a&&a.trainerId===current.id&&String(a.status||'').toLowerCase()!=='removed');
  const byDate={};
  my.forEach(a=>{if(a.date) byDate[String(a.date).slice(0,10)]=a;});
  const heads=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  let html='<div class="calendar-head">'+heads.map(h=>`<div>${h}</div>`).join('')+'</div><div class="calendar">';
  for(let i=0;i<start;i++) html+='<div class="day"></div>';
  const todayKey=`${year}-${String(month+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  for(let d=1;d<=days;d++){
    const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const a=byDate[key];
    let cls='day', label='';
    if(a){
      const st=String(a.status||'').trim().toLowerCase();
      if(st==='denied'||st==='absent'){cls+=' absent-day';label='ABSENT';}
      else if(st==='pending'||st==='pending inspection'){cls+=' pending-day';label='PENDING';}
      else if(st==='approved'||st==='present'){cls+=' present-day';label='PRESENT';}
      else {cls+=' pending-day';label=String(a.status||'RECORDED').toUpperCase();}
    } else if(key < todayKey){
      cls+=' unmarked-day'; label='NOT MARKED';
    } else {
      cls+=' upcoming-day';
    }
    html+=`<div class="${cls}"><div class="n">${d}</div>${label?`<small>${label}</small>`:''}</div>`;
  }
  return html+'</div>';
}

function haversineMeters_(lat1,lon1,lat2,lon2){const R=6371000,rad=Math.PI/180,dLat=(lat2-lat1)*rad,dLon=(lon2-lon1)*rad,a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(a));}

async function saveTrainerLocation(trainerId){

  const btn=(document.activeElement&&document.activeElement.tagName==='BUTTON')?document.activeElement:null;
  if(btn){btn.disabled=true;btn.dataset.oldText=btn.textContent;btn.textContent='Saving…';}

function reportDownloadUrl(fileUrl){

function masterTrainerCalendar(t,month){
 const parts=String(month||new Date().toISOString().slice(0,7)).split('-').map(Number),year=parts[0],m=parts[1]-1;
 if(!year||m<0||m>11)return '<p class="muted">Choose a valid month.</p>';
 const first=new Date(year,m,1),days=new Date(year,m+1,0).getDate(),offset=first.getDay(),now=new Date(),today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
 const map={};(db.attendance||[]).filter(a=>a.trainerId===t.id&&String(a.date||'').slice(0,7)===month&&String(a.status||'').toLowerCase()!=='removed').forEach(a=>{const key=String(a.date||'').slice(0,10);if(key)map[key]=a;});
 const heads=['SUN','MON','TUE','WED','THU','FRI','SAT'];let out=`<div class="section"><h3>${t.name} · ${new Date(year,m,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h3><div class="actions" style="margin:8px 0 14px"><span class="badge present">Present</span><span class="badge absent">Absent</span><span class="badge pending">Pending</span><span class="badge info">Not Marked / Upcoming</span></div><div class="calendar-head">${heads.map(h=>`<div>${h}</div>`).join('')}</div><div class="calendar">`;
 for(let i=0;i<offset;i++)out+='<div class="day" aria-hidden="true"></div>';
 for(let d=1;d<=days;d++){
  const key=`${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=map[key];let cls='day',label='';
  if(a){const s=String(a.status||'').trim().toLowerCase();if(['approved','present'].includes(s)){cls+=' present-day';label='PRESENT';}else if(['denied','absent'].includes(s)){cls+=' absent-day';label='ABSENT';}else if(['pending','pending inspection'].includes(s)){cls+=' pending-day';label='PENDING';}else{cls+=' unmarked-day';label='NOT MARKED';}}
  else if(key<today){cls+=' unmarked-day';label='NOT MARKED';}else{cls+=' upcoming-day';label='UPCOMING';}
  const detail=a?`${a.time||''}${a.school?' · '+a.school:''}${a.inspectedBy?' · '+a.inspectedBy:''}`:label==='NOT MARKED'?'No attendance record':label==='UPCOMING'?'Future date':'';
  out+=`<div class="${cls}" title="${detail.replace(/"/g,'&quot;')}"><div class="n">${d}</div><small>${label}</small>${a&&a.time?`<small style="font-weight:500;letter-spacing:0">${a.time}</small>`:''}</div>`;
 }
 return out+'</div><p class="footer-note">Statuses are based only on records returned by the backend. Past dates without a record are Not Marked, not assumed Absent. Future dates remain Upcoming.</p></div>';
}

async function updateAttendanceWithRetry_(updated){
  // The UI serializes attendance actions so 100 rapid clicks never create a
  // burst of competing writes. The backend also retries its short script lock.
  for(let attempt=0; attempt<4; attempt++){
    const r=await api('updateAttendanceBatch',{records:[updated]});
    if(r&&r.ok&&r.records&&r.records.length){ return r.records[0]; }
    if(!r || !r.retryable){ throw new Error((r&&r.error)||'Attendance update failed'); }
    await new Promise(resolve=>setTimeout(resolve,Math.min(500*(attempt+1),2000)));
  }
  throw new Error('Attendance server is temporarily busy. Please retry this attendance item.');
}

function enqueueAttendanceAction_(id,ok){
  if(attendanceActionsInFlight.has(String(id))) return;
  attendanceActionsInFlight.add(String(id));
  const task=async()=>{
    let a=db.attendance.find(x=>String(x.id)===String(id));
    if(!a)return;
    const updated=Object.assign({},a,{status:ok?'Approved':'Denied',inspectedBy:current.id,inspectedAt:new Date().toISOString()});
    const buttons=Array.from(document.querySelectorAll('button[onclick*=\"inspectAttendance\"]')).filter(b=>(b.getAttribute('onclick')||'').includes("'"+id+"'"));
    buttons.forEach(b=>{b.disabled=true;b.dataset.oldText=b.textContent;b.textContent='Queued…';});
    try{
      const authoritative=await updateAttendanceWithRetry_(updated);
      const idx=db.attendance.findIndex(x=>String(x.id)===String(id));
      if(idx>=0) db.attendance[idx]=authoritative;
      saveLocal();
    }catch(err){
      buttons.forEach(b=>{b.disabled=false;b.textContent=b.dataset.oldText||'Retry';});
      alert('Attendance update could not be synchronized. It was not marked as processed.\n\n'+err.message);
      throw err;
    }finally{
      attendanceActionsInFlight.delete(String(id));
    }
  };
  // Promise chaining creates a client-side FIFO queue. Each action starts only
  // after the previous one has completed, so 10, 100, or more pending cards can
  // be handled without a simultaneous-request burst.
  attendanceActionQueue=attendanceActionQueue.then(task,task);
  attendanceActionQueue.then(()=>{
    if(current&&mode==='master') renderMaster('Inspection');
  }).catch(()=>{
    if(current&&mode==='master') renderMaster('Inspection');
  });
}

const WEEK_FIELDS=[['dailyTask','Daily Task'],['additionalWork','Additional Work'],['issues','Issues / Concerns'],['other','Any Other']];
let weeklyEditor=null;
function weekMonday(date=new Date()) {const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function weekLabel(start){const d=new Date(start+'T12:00:00');const end=new Date(d);end.setDate(end.getDate()+5);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' – '+end.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function safeWeekly(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function openWeeklyForm(week){
  const start=week||weekMonday();const r=await api('getWeeklyForm',{trainerId:current.id,weekStart:start});
  if(!r||!r.ok)return alert('Could not load your weekly report. Check the Apps Script deployment.');
  weeklyEditor=r.report||{trainerId:current.id,name:current.name,weekStart:start,status:'Draft',days:{}};
  renderWeeklyEditor();
}
function renderWeeklyEditor(){
 const r=weeklyEditor,locked=r.status==='Submitted';
 const rows=WEEK_DAYS.map(day=>`<tr><th style="background:#e4f0fa;min-width:115px">${day}</th><td style="padding:0"><table style="width:100%;border-collapse:collapse">${WEEK_FIELDS.map(([k,label])=>`<tr><td style="width:160px;background:#f2f6fa;border:1px solid #dae2ef;padding:8px;font-weight:600">${label}</td><td style="border:1px solid #dae2ef;padding:5px"><textarea data-weekday="${day}" data-weekfield="${k}" ${locked?'disabled':''} style="width:100%;min-height:46px;box-sizing:border-box;resize:vertical;border:1px solid #d4deeb;border-radius:5px;padding:8px">${safeWeekly((r.days?.[day]||{})[k]||'')}</textarea></td></tr>`).join('')}</table></td></tr>`).join('');
 const html=`<div class="section card"><div class="title"><h3>Weekly Trainer Report</h3><button class="secondary" onclick="renderTrainer('Reports')">Back to Reports</button></div><p><b>Trainer:</b> ${safeWeekly(r.name||current.name)} &nbsp; <b>Week:</b> ${weekLabel(r.weekStart)} &nbsp; <b>Status:</b> ${safeWeekly(r.status)}</p><div class="actions"><button class="secondary" onclick="openWeeklyForm('${weekMonday(new Date(new Date(r.weekStart+'T12:00:00').getTime()-7*86400000))}')">Previous Week</button><button class="secondary" onclick="openWeeklyForm('${weekMonday(new Date(new Date(r.weekStart+'T12:00:00').getTime()+7*86400000))}')">Next Week</button></div><p class="muted">Enter each day's activities and save as a draft. You can return and continue until you submit the week to Master.</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr style="background:#1a385d;color:white"><th style="padding:12px">Day</th><th style="padding:12px">Work completed / Notes</th></tr></thead><tbody>${rows}</tbody></table></div><div class="actions" style="margin-top:18px">${locked?'<b>Submitted to Master — read only.</b>':`<button class="secondary" onclick="saveWeeklyForm(false)">Save Daily Progress</button><button class="primary" onclick="saveWeeklyForm(true)">Submit Week to Master</button>`}</div></div>`;
 layout('Employee Dashboard','Weekly Trainer Report',[['Reports',"renderTrainer('Reports')"],['Weekly Report',"openWeeklyForm()"]],'Weekly Report',html);
}
async function saveWeeklyForm(submit){
 if(!weeklyEditor||weeklyEditor.status==='Submitted')return;
 const days={...weeklyEditor.days};document.querySelectorAll('[data-weekday][data-weekfield]').forEach(el=>{const day=el.dataset.weekday;days[day]=days[day]||{};days[day][el.dataset.weekfield]=el.value.trim();});
 if(submit&&!confirm('Submit this week to Master? You will no longer be able to edit it.'))return;
 const r=await api('saveWeeklyForm',{report:{...weeklyEditor,days,status:submit?'Submitted':'Draft'}});
 if(!r||!r.ok)return alert('Could not save your weekly report. Your entries remain on screen; try again. '+(r?.error||''));
 weeklyEditor=r.report;renderWeeklyEditor();alert(submit?'Weekly report submitted to Master.':'Daily progress saved successfully.');
}
async function loadTrainerWeeklyHistory(){
 const el=document.getElementById('trainer-weekly-history');if(el)el.textContent='Loading weekly reports…';
 const r=await api('listMyWeeklyForms',{trainerId:current.id});
 const target=document.getElementById('trainer-weekly-history');if(!target)return;
 if(!r||!r.ok){target.textContent='Could not load weekly history: '+(r?.error||'Check Apps Script deployment and network.');return;}
 const records=(r.reports||[]).sort((a,b)=>String(b.weekStart).localeCompare(String(a.weekStart)));
 target.innerHTML=records.map(x=>`<div class="notice"><b>${weekLabel(x.weekStart)}</b> · ${safeWeekly(x.status)}<div class="actions" style="margin-top:8px"><button class="secondary" onclick="openWeeklyForm('${safeWeekly(x.weekStart)}')">${x.status==='Submitted'?'View Submitted Report':'Continue Draft'}</button></div><small>Last updated: ${safeWeekly(x.updatedAt||'')}</small></div>`).join('')||'<p class="muted">No weekly drafts or submissions yet.</p>';
}
async function openMasterWeekly(){
 const r=await api('listWeeklyForms',{});if(!r||!r.ok)return alert('Could not load weekly submissions. Check backend deployment.');
 const records=(r.reports||[]).filter(x=>x.status==='Submitted').sort((a,b)=>String(b.weekStart).localeCompare(String(a.weekStart)));
 const cards=records.map((x,i)=>`<div class="notice"><b>${safeWeekly(x.name)} (${safeWeekly(x.trainerId)})</b> · ${weekLabel(x.weekStart)} <button class="secondary" style="margin-left:12px" onclick="viewMasterWeekly(${i})">View Weekly Report</button><small>Submitted: ${safeWeekly(x.submittedAt||'')}</small></div>`).join('')||'<p class="muted">No submitted weekly reports yet.</p>';
 window.masterWeeklyRecords=records;
 layout('Employee Management Dashboard','Weekly Reports',[['Reports',"renderMaster('Reports')"],['Weekly Submissions',"openMasterWeekly()"]],'Weekly Submissions',`<div class="section card"><h3>Submitted Weekly Trainer Reports</h3>${cards}</div>`);
}
function viewMasterWeekly(i){
 const r=(window.masterWeeklyRecords||[])[i];if(!r)return;
 const rows=WEEK_DAYS.map(day=>`<tr><th style="background:#e4f0fa;padding:10px">${day}</th><td><table style="width:100%">${WEEK_FIELDS.map(([key,label])=>`<tr><td style="width:170px;padding:7px;background:#f2f6fa"><b>${label}</b></td><td style="padding:7px;white-space:pre-wrap">${safeWeekly(r.days?.[day]?.[key]||'—')}</td></tr>`).join('')}</table></td></tr>`).join('');
 layout('Employee Management Dashboard','Weekly Reports',[['Reports',"renderMaster('Reports')"],['Weekly Submissions',"openMasterWeekly()"]],'Weekly Submissions',`<div class="section card"><div class="title"><h3>${safeWeekly(r.name)} · ${weekLabel(r.weekStart)}</h3><button class="secondary" onclick="openMasterWeekly()">Back to Submissions</button></div><div style="overflow-x:auto"><table style="width:100%">${rows}</table></div></div>`);
}

function showModal(x){document.getElementById('modalBox').innerHTML=x;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
window.addEventListener('load', async ()=>{
  const sess=localStorage.getItem('stsTrainerSession');
  if(sess){
    try{ current=JSON.parse(sess); mode=localStorage.getItem('stsTrainerMode')||current.type||'trainer'; document.getElementById('splash').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('loginView').classList.add('hidden'); document.getElementById('topUser').textContent=current.name+' · '+current.id; syncEmployeeAccounts_(); const active=localStorage.getItem('stsTrainerActive')||'Overview'; mode==='master'?renderMaster(active):renderTrainer(active); loadRemote().then(ok=>{if(ok&&current){syncEmployeeAccounts_();const a=localStorage.getItem('stsTrainerActive')||'Overview';if(mode==='master')renderMasterCached_(a);else renderTrainer(a);}}).catch(()=>{}); }catch(e){ localStorage.removeItem('stsTrainerSession'); }
  }
});
let lastRemoteFingerprint='';
setInterval(async()=>{
  if(!current||API_URL.includes('PASTE_')) return;
  const before=JSON.stringify((db.attendance||[]).filter(a=>a.trainerId===current.id).map(a=>[a.id,a.date,a.status,a.inspectedAt]));
  const activeEl=document.activeElement;
  const editing=activeEl && ['INPUT','TEXTAREA','SELECT'].includes(activeEl.tagName);
  const modalOpen=document.getElementById('modal') && !document.getElementById('modal').classList.contains('hidden');
  await loadRemote();
  const after=JSON.stringify((db.attendance||[]).filter(a=>a.trainerId===current.id).map(a=>[a.id,a.date,a.status,a.inspectedAt]));
  if(editing||modalOpen) return;
  if(mode==='master' && window.activeMaster==='Inspection') renderMaster('Inspection');
  if(mode==='trainer' && before!==after && ['Attendance','Overview'].includes(window.activeTrainer||'')) renderTrainer(window.activeTrainer||'Attendance');
},30000);
function logout(){stopCamera();current=null;localStorage.removeItem('stsTrainerSession');localStorage.removeItem('stsTrainerMode');localStorage.removeItem('stsTrainerActive');document.getElementById('portal').innerHTML='';document.getElementById('portal').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');document.getElementById('topUser').textContent='';document.getElementById('loginPw').value='';}
</script></body></html>
